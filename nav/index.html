<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation — Firelord Zuko</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://i.postimg.cc/j2pB17fb/thing-carrd.png">

    <!-- Accent Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1b0d0d;
            color: #aa533b;
            font-family: "Courier New", monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Floating banner */
        .top-banner {
            width: 90%;
            max-width: 600px;
            margin-top: 30px;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 0 12px #aa533b);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Navigation container */
        .nav-links {
            margin-top: 40px;
            width: 90%;
            max-width: 600px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
        }

        /* Buttons */
        .nav-btn {
            padding: 14px 20px;
            border: 2px solid #aa533b;
            color: #aa533b;
            text-decoration: none;
            font-size: 1.2rem;
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
            border-radius: 6px;
            transition: 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        /* Flame flicker effect */
        .nav-btn::before {
            content: "";
            position: absolute;
            top: -80%;
            left: -20%;
            width: 140%;
            height: 300%;
            background: radial-gradient(circle, rgba(255,120,60,0.25) 0%, rgba(0,0,0,0) 70%);
            animation: flame 3s infinite ease-in-out;
            opacity: 0.4;
        }

        @keyframes flame {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(8deg) scale(1.1); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .nav-btn:hover {
            background-color: #aa533b;
            color: #1b0d0d;
            transform: scale(1.05);
            box-shadow: 0 0 18px #aa533b;
        }

        /* Mobile adjustments */
        @media (min-width: 600px) {
            .nav-links {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Floating top banner -->
    <img src="https://i.postimg.cc/WzdhnQGn/promo-2.gif" class="top-banner" alt="Zuko Banner">

    <!-- Navigation Buttons -->
    <div class="nav-links">
        <a href="/biography/" class="nav-btn">BIOGRAPHY</a>
        <a href="/rules/" class="nav-btn">RULES</a>
        <a href="/biography/" class="nav-btn">BIO</a>
        <a href="/mains/" class="nav-btn">MAINS</a>
        <a href="/verses/" class="nav-btn">VERSES</a>
        <a href="/gallery/" class="nav-btn">GALLERY</a>
        <a href="/headcanons/" class="nav-btn">HEADCANONS</a>
        <a href="/contact/" class="nav-btn">CONTACT</a>
    </div>

</body>
</html>
