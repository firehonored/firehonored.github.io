<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firelord Zuko</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://i.postimg.cc/j2pB17fb/thing-carrd.png">

    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #1b0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Georgia', serif;
        }

        /* Floating animation */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        .fire-icon {
            width: 220px;
            transition: transform 0.6s ease, filter 0.6s ease;
            animation: float 4s ease-in-out infinite;
            cursor: pointer;
            filter: drop-shadow(0 0 12px #aa533b);
        }

        .fire-icon:active {
            transform: scale(1.15);
        }

        /* Expansion animation */
        .expand {
            animation: expandAnim 0.6s forwards ease-out;
        }

        @keyframes expandAnim {
            0% { transform: scale(1); }
            100% { transform: scale(3); opacity: 0; }
        }
    </style>
</head>

<body>

    <img src="https://i.postimg.cc/j2pB17fb/thing-carrd.png" 
         class="fire-icon" 
         id="fireIcon"
         alt="Firelord Zuko Icon">

    <script>
        const icon = document.getElementById('fireIcon');

        icon.addEventListener('click', () => {
            icon.classList.add('expand');

            setTimeout(() => {
                window.location.href = "/nav/";
            }, 600);
        });
    </script>

</body>
</html>
